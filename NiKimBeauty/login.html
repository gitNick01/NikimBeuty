<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - NiKim Beauty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
    <div class="page-wrapper bg-login">
        
       
        <header class="main-header auth-header">
            <div class="auth-top-label">ENTRAR/CADASTRO</div>
            <div class="auth-divider">|</div>
            <div class="header-actions">
                <a href="cadastro-etapa1.html" class="action-icon header-action-button">Cadastro</a>
                <a href="carrinho.html" class="action-icon header-action-button">Carrinho</a>
            </div>
        </header>

       
        <main class="auth-split-container">
            <div class="auth-login-column">
                <div class="auth-card">
                    <h2>BEM-VINDO DE VOLTA!</h2>
                    
                    <form class="auth-form">
                        <input type="text" class="pink-input" placeholder="Número de Telefone/E-mail" required>
                        <input type="password" class="pink-input" placeholder="Senha" required>
                        
                        <a href="#" class="forgot-link">Esqueceu a senha?</a>
                        
                        <button type="submit" class="btn-pill full-btn">ENTRAR</button>
                        
                        <div class="auth-options-row">
                            <label class="remember-me">
                                <input type="checkbox"> Lembre-se de mim
                            </label>
                            <a href="#" class="sms-link">Fazer login com SMS</a>
                        </div>
                    </form>

                    <div class="social-login-divider">
                        <span>OU</span>
                        <p>Continue com:</p>
                    </div>

                    <button type="button" class="btn-google">
                        <span class="google-icon"><img src="/img/googleicone.png" alt="Google"></span> Google
                    </button>

                    <p class="terms-text">
                        Ao logar sua conta você concorda com os nossos<br>
                        <a href="#">Termos de serviço</a> & <a href="#">Política de privacidade</a>
                    </p>

                    <p class="switch-auth">
                        Primeira vez aqui? <a href="cadastro-etapa1.html">CADASTRE-SE</a>
                    </p>
                </div>
                <a href="index.html" class="btn-pill btn-voltar">VOLTAR</a>
            </div>

            <div class="auth-right-side">
                <div class="main-logo-box">
                    <img src="/img/logoNK.png" alt="NiKim Beauty">
                </div>
            </div>
        </main>

      
        <footer class="main-footer">
            <div class="footer-slogan">Realçando sua beleza com delicadeza</div>
        </footer>
    </div>
</body>
</html>
