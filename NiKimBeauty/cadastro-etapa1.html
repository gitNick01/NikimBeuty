<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - NiKim Beauty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="page-wrapper bg-cadastro">
        <header class="main-header page-action-header">
            <div class="header-actions">
                <a href="cadastro-etapa1.html" class="action-icon header-action-button">Cadastro</a>
                <a href="carrinho.html" class="action-icon header-action-button">Carrinho</a>
            </div>
        </header>

        <main class="cadastro-container">
            <div class="cadastro-logo-side">
                <img src="/img/logoNK.png" alt="NiKim Beauty">
            </div>

          
            <div class="cadastro-form-side">
                <div class="auth-card wide">
                    <h2>Que bom ter você conosco!</h2>
                    <form action="cadastro-etapa2.html" class="auth-form">
                        <input type="text" class="pink-input" placeholder="Nome completo" required>
                        <input type="text" class="pink-input" placeholder="E-mail/Telefone" required>
                        <input type="text" class="pink-input" placeholder="CPF" required>
                        <input type="password" class="pink-input" placeholder="Criar senha" required>
                        <input type="password" class="pink-input" placeholder="Confirmar senha" required>
                        
                        <button type="submit" class="btn-submit center-btn">Continuar &rarr;</button>
                    </form>
                </div>
            </div>
        </main>

     
        <footer class="main-footer">
            <div class="footer-slogan">Realçando sua beleza com delicadeza</div>
            <div class="footer-divider"><span class="line"></span><span class="heart">&hearts;</span><span class="line"></span></div>
            <div class="footer-newsletter">
                <label for="newsletter-email">RECEBA NOVIDADE E OFERTAS</label>
                <form class="newsletter-form">
                    <input type="email" id="newsletter-email" placeholder="Seu melhor e-mail" required>
                   
                </form>
            </div>
        </footer>
    </div>
</body>
</html>
